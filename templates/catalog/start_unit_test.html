{% extends "base.html" %}

{% block title %}{{ test.title }} — EduWeb{% endblock %}

{% block content %}
<a href="{% url 'course_detail' test.unit.course.id %}" class="backlink">&lsaquo; Back to course</a>

<div class="page-header">
    <span class="badge badge-accent" style="margin-bottom:0.6rem;">Unit Test</span>
    <h1 style="margin-top:0.4rem;">{{ test.title }}</h1>
    <p class="meta" style="margin-bottom:0;">{{ test.unit.course.title }} &middot; {{ test.unit.title }}</p>
</div>

{% if test.instructions %}
    <div class="card content-area" style="padding:1.5rem;margin-top:0;">{{ test.instructions }}</div>
{% endif %}
{% endblock %}
