{% extends "base.html" %}


{% block content %}


<h1>{{ page.title }}</h1>


<p><strong>Course:</strong> {{ page.unit.course.title }}</p>
<p><strong>Unit:</strong> {{ page.unit.title }}</p>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css">
<div id="content"></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script>
    (function () {
        function renderContent(raw) {
            const blocks = [];
            let text = raw.replace(/\$\$([\s\S]*?)\$\$|\$([^$\n]+?)\$/g, (_, dm, im) => {
                blocks.push(dm !== undefined ? {m: dm, d: true} : {m: im, d: false});
                return `%%MATH${blocks.length - 1}%%`;
            });
            text = marked.parse(text, {breaks: true});
            return text.replace(/%%MATH(\d+)%%/g, (_, i) => {
                const {m, d} = blocks[+i];
                try { return katex.renderToString(m, {throwOnError: false, displayMode: d}); }
                catch (e) { return d ? `$$${m}$$` : `$${m}$`; }
            });
        }
        document.getElementById('content').innerHTML = renderContent("{{ raw_content|escapejs }}");
    })();
</script>


<div style="margin-top: 20px; display: flex; justify-content: space-between;">


    {% if prev_page %}
        <a href="{% url 'notes_detail' prev_page.id %}">
            ← Previous
        </a>
    {% endif %}


    {% if next_page %}
        <a href="{% url 'notes_detail' next_page.id %}">
            Next →
        </a>
    {% endif %}


</div>


<p>
    <a href="{% url 'course_detail' page.unit.course.id %}">← Back to course</a>
</p>


{% if user.is_staff %}
<p>
    <a href="{% url 'notes_edit' page.id %}">Edit this page</a>
</p>
{% endif %}


{% endblock %}
