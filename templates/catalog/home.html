{% extends "base.html" %}

{% block content %}
<h1>EdTech Startup</h1>

<h2>Courses</h2>

{% if courses %}
    <ul>
    {% for course in courses %}
        <li>
            <a href="{% url 'course_detail' course.id %}">
                <strong>{{ course.title }}</strong>
            </a><br>
            {{ course.description }}
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No courses yet.</p>
{% endif %}
{% endblock %}
