{% extends "base.html" %}

{% block content %}
<h1>EdTech Startup</h1>

{% if subjects %}
    {% for subject in subjects %}
        <div style="margin-bottom: 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid #ddd;">
            <h2 style="margin-bottom: 0.25rem;">
                <a href="{% url 'subject_detail' subject.id %}">{{ subject.title }}</a>
            </h2>
            {% if subject.description %}
                <p style="margin-top:0.4rem;">{{ subject.description }}</p>
            {% endif %}
        </div>
    {% endfor %}
{% else %}
    <p>No subjects yet.</p>
{% endif %}
{% endblock %}
