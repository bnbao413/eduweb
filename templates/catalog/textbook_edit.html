<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Textbook Page</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
        }

        .editor-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }

        .editor-pane,
        .preview-pane {
            width: 50%;
        }

        textarea {
            width: 100%;
            min-height: 600px;
            font-family: monospace;
            font-size: 1rem;
            padding: 1rem;
            box-sizing: border-box;
        }

        .preview-box {
            border: 1px solid #ccc;
            padding: 1rem;
            min-height: 600px;
            background: #fafafa;
            overflow-wrap: break-word;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
        }

        button {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            cursor: pointer;
        }

        .preview-box h1,
        .preview-box h2,
        .preview-box h3 {
            margin-top: 1.25rem;
        }

        .preview-box p {
            line-height: 1.7;
        }

        .preview-box code {
            background: #eee;
            padding: 0.1rem 0.3rem;
        }

        .preview-box pre {
            background: #eee;
            padding: 1rem;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Edit Textbook Page</h1>

    <p><strong>Current page:</strong> {{ page.title }}</p>

    <form method="post">
        {% csrf_token %}

        <p>
            <label for="{{ form.title.id_for_label }}">Title</label><br>
            {{ form.title }}
        </p>

        <div class="editor-layout">
            <div class="editor-pane">
                <h2>Editor</h2>
                <textarea id="content-input" name="content">{{ form.instance.content }}</textarea>
            </div>

            <div class="preview-pane">
                <h2>Live Preview</h2>
                <div id="preview" class="preview-box"></div>
            </div>
        </div>

        <button type="submit">Save</button>
    </form>

    <p>
        <a href="{% url 'textbook_detail' page.id %}">← Back to textbook page</a>
    </p>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/contrib/auto-render.min.js"></script>

    <script>
        const input = document.getElementById("content-input");
        const preview = document.getElementById("preview");

        function updatePreview() {
            const raw = input.value;
            preview.innerHTML = marked.parse(raw);

            renderMathInElement(preview, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "\\[", right: "\\]", display: true },
                    { left: "$", right: "$", display: false },
                    { left: "\\(", right: "\\)", display: false }
                ],
                throwOnError: false
            });
        }

        input.addEventListener("input", updatePreview);
        updatePreview();
    </script>
</body>
</html>
