<!DOCTYPE html>
<html>
<head>
    <title>EduWeb</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", serif;
            margin: 0;
            background: #f8f8f8;
            color: #111;
        }

        .page-shell {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px 56px;
        }

        h1, h2, h3 {
            line-height: 1.2;
        }

        p, li {
            font-size: 1.1rem;
            line-height: 1.7;
        }

        a {
            color: #0b57d0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .meta {
            color: #444;
            margin-bottom: 24px;
        }

        .content-area {
            margin-top: 24px;
            overflow-wrap: break-word;
            word-break: break-word;
        }
    </style>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    
</head>
<body>
    <div class="page-shell">
        <div style="text-align:right; margin-bottom:1rem; font-size:0.95rem;">
            {% if user.is_authenticated %}
                Logged in as <strong>{{ user.username }}</strong> &nbsp;|&nbsp;
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none;border:none;color:#0b57d0;cursor:pointer;font-size:inherit;padding:0;text-decoration:none;">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log In</a> &nbsp;|&nbsp;
                <a href="{% url 'register' %}">Create Account</a>
            {% endif %}
        </div>
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
