{% extends "base.html" %}

{% block content %}
<h1>Reset Password</h1>
<p>Enter your email address and we'll send you a link to reset your password.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send Reset Link</button>
</form>

<p><a href="{% url 'login' %}">← Back to login</a></p>
{% endblock %}
