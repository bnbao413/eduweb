{% extends "base.html" %}

{% block title %}Set new password — EduWeb{% endblock %}

{% block content %}
<div class="narrow">
    <div class="page-header" style="text-align:center;">
        <h1>Set a new password</h1>
    </div>

    {% if validlink %}
        <div class="auth-card form-card">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary btn-block">Set password</button>
            </form>
        </div>
    {% else %}
        <div class="auth-card">
            <p style="margin:0;">This reset link is invalid or has already been used.
            <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
        </div>
    {% endif %}
</div>
{% endblock %}
