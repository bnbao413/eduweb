{% extends "base.html" %}

{% block content %}
<h1>Set New Password</h1>

{% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Set Password</button>
    </form>
{% else %}
    <p>This reset link is invalid or has already been used. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
{% endif %}
{% endblock %}
