{% extends "base.html" %}

{% block title %}Create account — Didelta{% endblock %}

{% block content %}
<div class="narrow">
    <div class="page-header" style="text-align:center;">
        <h1>Create your account</h1>
        <p class="page-subtitle">Get started with Didelta.</p>
    </div>

    <div class="auth-card form-card">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>
    </div>

    <p style="text-align:center;margin-top:1.25rem;color:var(--text-muted);">
        Already have an account? <a href="{% url 'login' %}">Log in</a>
    </p>
</div>
{% endblock %}
