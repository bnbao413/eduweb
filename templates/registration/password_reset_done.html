{% extends "base.html" %}

{% block title %}Check your email — EduWeb{% endblock %}

{% block content %}
<div class="narrow">
    <div class="page-header" style="text-align:center;">
        <h1>Check your email</h1>
    </div>
    <div class="auth-card">
        <p style="margin:0 0 1rem;">If an account with that email exists, we've sent a password reset link. Check your inbox.</p>
        <a href="{% url 'login' %}" class="btn btn-secondary btn-block">Back to login</a>
    </div>
</div>
{% endblock %}
