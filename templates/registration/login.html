{% extends "base.html" %}

{% block content %}
<h1>Log In</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log In</button>
</form>

<p><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
<p>Don't have an account? <a href="{% url 'register' %}">Create one</a></p>
{% endblock %}
